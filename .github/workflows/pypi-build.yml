on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          python-version: 3.14
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install --python=3.14 babel build

      - name: Compile translations
        run: |
          dir=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("babel", {}).get("compile_catalog", {}).get("directory", ""))')
          if [[ -n "$dir" ]]
          then
            pybabel compile --directory="$dir"
          fi

      - name: Build package
        run: |
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
