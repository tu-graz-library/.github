name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python versions"
        type: string
        default: '["3.14", "3.15"]'
      db-service:
        description: "DB service"
        type: string
        default: '["postgresql16"]'
      search-service:
        description: "Search service"
        type: string
        default: '["opensearch2"]'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-version) }}
        db-service: ${{ fromJson(inputs.db-service) }}
        search-service: ${{ fromJson(inputs.search-service) }}

    env:
      DB: ${{ matrix.db-service }}
      SEARCH: ${{ matrix.search-service }}
      UV_SYSTEM_PYTHON: 1  # Force uv to install dependencies in the system-managed Python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Pre-install
        uses: ./.github/actions/pre-install
        if: ${{ hashFiles('.github/actions/pre-install/action.yml') != '' }}

      - name: Install dependencies
        run: |
          uv pip install -q ".[tests]"
          uv pip list
          docker version

      - name: Run tests
        run: |
          ./run-tests.sh
