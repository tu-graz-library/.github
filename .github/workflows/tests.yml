name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python versions"
        type: string
        default: '["3.14", "3.15"]'
      db-service:
        description: "DB service"
        type: string
        default: '["postgresql18"]'
      search-service:
        description: "Search service"
        type: string
        default: '["opensearch3"]'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-version) }}
        db-service: ${{ fromJson(inputs.db-service) }}
        search-service: ${{ fromJson(inputs.search-service) }}

    env:
      DB: ${{ matrix.db-service }}
      SEARCH: ${{ matrix.search-service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install -q ".[tests]"
          uv pip list
          docker version

      - name: Run tests
        run: |
          ./run-tests.sh
